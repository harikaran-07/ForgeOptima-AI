services:
  - type: web
    name: forgeoptima-ai
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: ".:backend"
      - key: CORS_ORIGINS
        value: "https://forge-optima-ai.vercel.app,http://localhost:5173,http://localhost:4173"
